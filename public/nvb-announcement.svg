<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Notification: 5 Oct, something big happened. NVB equation under review. NVS will be affected. Thank you." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2456"/>
      <stop offset="1" stop-color="#0e1332"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8dff"/>
      <stop offset="1" stop-color="#1d3fc4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb81f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.07" stop-color="#fff"/>
      <stop offset="0.93" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="tickerMask" maskUnits="userSpaceOnUse" x="206" y="82" width="534" height="24">
      <rect x="206" y="82" width="534" height="24" fill="url(#fade)"/>
    </mask>
    <clipPath id="clip"><rect x="4" y="4" width="752" height="128" rx="16"/></clipPath>
    <clipPath id="confClip"><rect x="196" y="4" width="560" height="112"/></clipPath>
    <pattern id="party" x="0" y="116" width="48" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-40)">
      <rect x="0" width="12" height="12" fill="#ff5fa2"/>
      <rect x="12" width="12" height="12" fill="#ffd24a"/>
      <rect x="24" width="12" height="12" fill="#4de2c5"/>
      <rect x="36" width="12" height="12" fill="#8b9cff"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .btn { cursor: pointer; }
    .btn .face { transition: filter .2s; }
    .btn:hover .face { filter: brightness(1.15); }
    .pulse { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .slide { animation: slide .8s linear infinite; }
    .ticker { animation: roll 12s linear infinite; }
    .btn:hover .ticker { animation-play-state: paused; }
    .c { animation: fall 4.5s linear infinite; transform-box: fill-box; transform-origin: center; opacity: .75; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(560px); } }
    @keyframes pulse { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.12) rotate(8deg); } }
    @keyframes blink { to { opacity: .25; } }
    @keyframes twinkle { 0%,100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes slide { from { transform: translateX(-48px); } to { transform: translateX(0); } }
    @keyframes fall { from { transform: translateY(-16px) rotate(0deg); } to { transform: translateY(132px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .twinkle, .slide, .ticker, .c { animation: none; } }
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>

  <g class="btn">
    <rect x="4" y="4" width="752" height="128" rx="16" fill="#000" filter="url(#shadow)"/>
    <g class="face" clip-path="url(#clip)">
      <rect x="4" y="4" width="752" height="128" fill="url(#body)"/>

      <!-- confetti -->
      <g clip-path="url(#confClip)">
        <rect class="c" x="230" y="4" width="6" height="10" fill="#ff5fa2" style="animation-delay:-0.2s"/>
        <rect class="c" x="290" y="4" width="8" height="5" fill="#ffd24a" style="animation-delay:-1.6s"/>
        <rect class="c" x="350" y="4" width="6" height="9" fill="#4de2c5" style="animation-delay:-3.0s"/>
        <rect class="c" x="410" y="4" width="8" height="5" fill="#8b9cff" style="animation-delay:-0.9s"/>
        <rect class="c" x="470" y="4" width="6" height="10" fill="#ff5fa2" style="animation-delay:-2.4s"/>
        <rect class="c" x="530" y="4" width="8" height="5" fill="#ffd24a" style="animation-delay:-3.8s"/>
        <rect class="c" x="590" y="4" width="6" height="9" fill="#4de2c5" style="animation-delay:-1.2s"/>
        <rect class="c" x="650" y="4" width="8" height="5" fill="#8b9cff" style="animation-delay:-2.8s"/>
        <rect class="c" x="710" y="4" width="6" height="10" fill="#ff5fa2" style="animation-delay:-0.6s"/>
        <rect class="c" x="320" y="4" width="5" height="8" fill="#ffd24a" style="animation-delay:-4.1s"/>
        <rect class="c" x="620" y="4" width="5" height="8" fill="#ff5fa2" style="animation-delay:-3.4s"/>
      </g>

      <!-- blue tab -->
      <rect x="4" y="4" width="176" height="128" fill="url(#tab)"/>
      <polygon points="180,4 196,4 180,132 164,132" fill="#1b3aa8"/>

      <!-- star + sparkles -->
      <circle class="twinkle" cx="52" cy="28" r="3.5" fill="#fff" style="animation-delay:-.3s"/>
      <circle class="twinkle" cx="136" cy="26" r="3" fill="#fff" style="animation-delay:-.9s"/>
      <circle class="twinkle" cx="142" cy="78" r="3.5" fill="#fff" style="animation-delay:-1.2s"/>
      <circle class="twinkle" cx="44" cy="74" r="3" fill="#fff" style="animation-delay:-.6s"/>
      <g class="pulse">
        <polygon points="92,21 100.2,43.7 124.3,44.5 105.3,59.3 112,82.5 92,69 72,82.5 78.7,59.3 59.7,44.5 83.8,43.7" fill="url(#gold)" stroke="#fff1b0" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <text x="92" y="108" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2.5" fill="#fff">NOTIFICATION</text>

      <!-- label -->
      <circle class="blink" cx="212" cy="33" r="4.5" fill="#4de2c5"/>
      <text x="224" y="37" font-size="12" font-weight="700" letter-spacing="2.5" fill="#ffd24a">5 OCT</text>

      <!-- pill -->
      <rect x="614" y="22" width="126" height="22" rx="11" fill="none" stroke="#ffd24a" stroke-width="1.5"/>
      <text x="677" y="37" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ffd24a">UNDER REVIEW</text>

      <!-- headline -->
      <text x="206" y="74" font-size="26" font-weight="800" fill="#ffffff">SOMETHING BIG IS COMING SOON</text>
      <g mask="url(#tickerMask)">
        <g class="ticker">
          <text x="-354" y="98" font-size="14" fill="#d3e0ff" textLength="560" lengthAdjust="spacing" xml:space="preserve"> Wait is Over Now Something Coming With Docs 😅 NVB equation under review — NVS will be affected. Thank you.   ●   </text>
          <text x="206" y="98" font-size="14" fill="#d3e0ff" textLength="560" lengthAdjust="spacing" xml:space="preserve"> Wait is Over Now Something Coming With Docs 😅 NVB equation under review — NVS will be affected. Thank you.   ●   </text>
        </g>
      </g>

      <!-- party strip -->
      <rect x="4" y="116" width="752" height="16" fill="#0b0f28"/>
      <rect class="slide" x="-60" y="116" width="880" height="12" fill="url(#party)"/>
      <rect x="4" y="128" width="752" height="4" fill="#000" opacity="0.35"/>

      <!-- gloss -->
      <rect x="4" y="4" width="752" height="56" fill="url(#gloss)"/>
    </g>
    <rect x="4" y="4" width="752" height="128" rx="16" fill="none" stroke="#3d54b5" stroke-width="1.5"/>
  </g>
</svg>
