<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEV — Central Router</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#08090a;
    --grid:#111413;
    --dim:#3a4340;
    --text:#c9d6d0;
    --text-dim:#5a6864;
    --bright:#eef5f0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
    font-family:'JetBrains Mono', 'Fira Code', monospace;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 20px;
  }

  .stage{
    width:min(94vw, 900px);
    aspect-ratio:1/1;
    position:relative;
  }

  .header{
    position:absolute;
    top:-46px;
    left:0;
    right:0;
    text-align:center;
    letter-spacing:.14em;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .header b{ color:var(--bright); }

  svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .link{
    stroke:var(--dim);
    stroke-width:.35;
    stroke-dasharray:1.6 1.4;
    fill:none;
    animation:crawl 6s linear infinite;
  }
  .link.sub{ stroke:var(--dim); opacity:.7; }
  @keyframes crawl{ to{ stroke-dashoffset:-60; } }

  .node{
    position:absolute;
    transform:translate(-50%,-50%);
    text-align:center;
    white-space:pre;
    font-size:11px;
    line-height:1.35;
    color:var(--text);
    pointer-events:none;
  }
  .node.sub{ font-size:10px; color:var(--text-dim); }

  .dev{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    white-space:pre;
    font-size:14px;
    font-weight:700;
    color:var(--bright);
    line-height:1.3;
    animation:breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ text-shadow:0 0 0 transparent; }
    50%{ text-shadow:0 0 10px rgba(238,245,240,0.35); }
  }
  .dev .tag{
    display:block;
    font-size:9px;
    font-weight:400;
    letter-spacing:.1em;
    color:var(--text-dim);
    margin-top:3px;
  }

  .legend{
    position:absolute;
    bottom:-46px;
    left:0; right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:.05em;
    color:var(--text-dim);
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="header"><b>DEV</b> — central router · NEURAL-Y / cerium-delta</div>

  <svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>

  <div class="dev">┏━━━━━━━━━━━━━┓
┃     DEV     ┃
┃  ·  CDIR ·  ┃
┗━━━━━━━━━━━━━┛<span class="tag">structures data before NVS</span></div>

  <div id="nodes"></div>

  <div class="legend">converters feed FRAMEWORK ROUTER → user's chosen framework is picked here → passed to DEV → CDIR structures it → NVS → schema → back through DEV to SURFACE/VIS</div>
</div>

<script>
// primary nodes: directly connected to DEV
const PRIMARY = [
  { label:"SURFACE / VIS",      x:50, y:9  },
  { label:"FRAMEWORK ROUTER",   x:12, y:50 },
  { label:"NVS",                 x:88, y:50 },
  { label:"NVS RESULT SCHEMA",  x:50, y:91 },
];

// secondary nodes: connected only to FRAMEWORK ROUTER
const ROUTER = PRIMARY[1];
const SECONDARY = [
  { label:"PyTorch",     angle:150 },
  { label:"TensorFlow",  angle:178 },
  { label:"JAX",         angle:190 },
  { label:"sklearn",     angle:214 },
];
const SUB_RADIUS = 15;
SECONDARY.forEach(n => {
  const rad = n.angle * Math.PI / 180;
  n.x = ROUTER.x + SUB_RADIUS * Math.cos(rad);
  n.y = ROUTER.y + SUB_RADIUS * Math.sin(rad);
});

const cx = 50, cy = 50;
const nodesEl = document.getElementById('nodes');
const svg = document.getElementById('lines');
const NS = "http://www.w3.org/2000/svg";

function asciiBox(label){
  const w = label.length + 2;
  const top = "┌" + "─".repeat(w) + "┐";
  const mid = "│ " + label + " │";
  const bot = "└" + "─".repeat(w) + "┘";
  return top + "\n" + mid + "\n" + bot;
}

function addNode(n, sub){
  const div = document.createElement('div');
  div.className = 'node' + (sub ? ' sub' : '');
  div.style.left = n.x + '%';
  div.style.top = n.y + '%';
  div.textContent = asciiBox(n.label);
  nodesEl.appendChild(div);
}

function addLine(x1,y1,x2,y2, sub, delay){
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('class', 'link' + (sub ? ' sub' : ''));
  line.style.animationDelay = delay + 's';
  svg.appendChild(line);
}

function addPulse(x1,y1,x2,y2, dur, begin){
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', 0.8);
  c.setAttribute('fill', '#eef5f0');
  const anim = document.createElementNS(NS, 'animateMotion');
  anim.setAttribute('dur', dur + 's');
  anim.setAttribute('repeatCount', 'indefinite');
  anim.setAttribute('path', `M${x1},${y1} L${x2},${y2}`);
  anim.setAttribute('begin', begin + 's');
  c.appendChild(anim);
  svg.appendChild(c);
}

// DEV <-> primary nodes
PRIMARY.forEach((n, i) => {
  addNode(n, false);
  addLine(cx, cy, n.x, n.y, false, -i * 0.4);
  const dur = 2.8 + (i % 3) * 0.4;
  addPulse(cx, cy, n.x, n.y, dur, i * 0.3);
  addPulse(n.x, n.y, cx, cy, dur, i * 0.3 + dur / 2);
});

// FRAMEWORK ROUTER <-> converters
SECONDARY.forEach((n, i) => {
  addNode(n, true);
  addLine(ROUTER.x, ROUTER.y, n.x, n.y, true, -i * 0.5);
  const dur = 2.2 + (i % 2) * 0.3;
  // only outbound-to-router direction (converters feed the router)
  addPulse(n.x, n.y, ROUTER.x, ROUTER.y, dur, i * 0.4);
});
</script>

</body>
</html>
