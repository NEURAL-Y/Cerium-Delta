<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Alert: Cerium Delta under development due to an unexpected bug. We are resolving it and will fix it soon." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b3b"/>
      <stop offset="1" stop-color="#b3141c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.07" stop-color="#fff"/>
      <stop offset="0.93" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="tickerMask" maskUnits="userSpaceOnUse" x="206" y="82" width="534" height="24">
      <rect x="206" y="82" width="534" height="24" fill="url(#fade)"/>
    </mask>
    <clipPath id="clip"><rect x="4" y="4" width="752" height="128" rx="16"/></clipPath>
    <pattern id="haz" x="0" y="116" width="24" height="12" patternUnits="userSpaceOnUse">
      <polygon points="0,12 12,12 24,0 12,0" fill="#ffc629"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .btn { cursor: pointer; }
    .btn .face { transition: filter .2s; }
    .btn:hover .face { filter: brightness(1.15); }
    .pulse { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    .slide { animation: slide .8s linear infinite; }
    .ticker { animation: roll 12s linear infinite; }
    .btn:hover .ticker { animation-play-state: paused; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(560px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes blink { to { opacity: .25; } }
    @keyframes slide { from { transform: translateX(-24px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .slide, .ticker { animation: none; } }
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>

  <g class="btn">
    <!-- shadow + body -->
    <rect x="4" y="4" width="752" height="128" rx="16" fill="#000" filter="url(#shadow)"/>
    <g class="face" clip-path="url(#clip)">
      <rect x="4" y="4" width="752" height="128" fill="url(#body)"/>

      <!-- red ALERT tab -->
      <rect x="4" y="4" width="176" height="128" fill="url(#tab)"/>
      <polygon points="180,4 196,4 180,132 164,132" fill="#b3141c" transform="translate(0,0)"/>

      <!-- warning triangle -->
      <g class="pulse">
        <polygon points="92,22 134,88 50,88" fill="#ffc629" stroke="#ffe08a" stroke-width="3" stroke-linejoin="round"/>
        <rect x="88.5" y="42" width="7" height="24" rx="3.5" fill="#1a1a1a"/>
        <circle cx="92" cy="76" r="4" fill="#1a1a1a"/>
      </g>
      <text x="92" y="108" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="4" fill="#fff">ALERT</text>

      <!-- live label -->
      <circle class="blink" cx="212" cy="33" r="4.5" fill="#ff4d4d"/>
      <text x="224" y="37" font-size="12" font-weight="700" letter-spacing="2.5" fill="#ffc629">STATUS UPDATE</text>

      <!-- fix pill -->
      <rect x="614" y="22" width="126" height="22" rx="11" fill="none" stroke="#ffc629" stroke-width="1.5"/>
      <text x="677" y="37" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ffc629">FIX IN PROGRESS</text>

      <!-- headline -->
      <text x="206" y="74" font-size="27" font-weight="800" fill="#ffffff">CERIUM DELTA UNDER DEVELOPMENT</text>
      <g mask="url(#tickerMask)">
        <g class="ticker">
          <text x="-354" y="98" font-size="14" fill="#cfd6e4" textLength="560" lengthAdjust="spacing" xml:space="preserve">Unexpected bug detected — we're resolving it and will fix it soon.   ●   </text>
          <text x="206" y="98" font-size="14" fill="#cfd6e4" textLength="560" lengthAdjust="spacing" xml:space="preserve">Unexpected bug detected — we're resolving it and will fix it soon.   ●   </text>
        </g>
      </g>

      <!-- hazard progress strip -->
      <rect x="4" y="116" width="752" height="16" fill="#1b202c"/>
      <rect class="slide" x="0" y="116" width="830" height="12" fill="url(#haz)"/>
      <rect x="4" y="128" width="752" height="4" fill="#000" opacity="0.35"/>

      <!-- gloss -->
      <rect x="4" y="4" width="752" height="56" fill="url(#gloss)"/>
    </g>
    <rect x="4" y="4" width="752" height="128" rx="16" fill="none" stroke="#3a4359" stroke-width="1.5"/>
  </g>
</svg>
