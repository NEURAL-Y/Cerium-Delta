<svg xmlns="http://www.w3.org/2000/svg" width="160" height="28" viewBox="0 0 160 28">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="45%" stop-color="#39d353"/>
      <stop offset="55%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#0b2545"/>
      <animate attributeName="x1" values="-100%;100%" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;300%" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="160" height="28" rx="6" fill="#0b2545" stroke="#1f5fa8"/>
  <text x="80" y="19" font-family="Verdana, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="url(#shimmer)">Cerium Delta</text>
</svg>
