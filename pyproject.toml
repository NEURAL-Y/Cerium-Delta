[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "cerium-delta"
version = "1.0.0"
description = "Neural network observability and Neural Vitality analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "NEURAL-Y" }
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11"
]

[project.optional-dependencies]

torch = [
    "torch"
]

tensorflow = [
    "tensorflow"
]

jax = [
    "jax"
]

sklearn = [
    "scikit-learn"
]

all = [
    "torch",
    "tensorflow",
    "jax",
    "scikit-learn"
]

dev = [
    "pytest",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/NEURAL-Y/cerium-delta"
Repository = "https://github.com/NEURAL-Y/cerium-delta"
Issues = "https://github.com/NEURAL-Y/cerium-delta/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "cerium_delta.visualizers",
    "cerium_delta.visualizers.*"
]
